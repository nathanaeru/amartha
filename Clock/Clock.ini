[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Clock
Author=Naeru
Information=Time and date.
Version=1.0


[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%a, %d %b %Y


[MeterTime]
Meter=String
MeasureName=MeasureTime
FontFace=JetBrainsMonoNL Nerd Font
FontSize=120
FontColor=202,211,245,255
StringAlign=Right
X=600
Y=0
AntiAlias=1

[MeterDate]
Meter=String
MeasureName=MeasureDate
FontFace=JetBrainsMonoNL Nerd Font
FontSize=30
FontColor=202,211,245,255
StringAlign=Right
X=0r
Y=-15R
AntiAlias=1