[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Amartha Clock
Author=Naeru
Information=Right-aligned time and date.
Version=1.0

[Variables]
@Include=#@#Variables.inc

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%a, %d %b %Y

[MeterTime]
Meter=String
MeasureName=MeasureTime
FontFace=#MainFont#
FontSize=#ClockTimeSize#
FontColor=#ColorMain#,255
StringAlign=Right
X=1000
Y=0
AntiAlias=1

[MeterDate]
Meter=String
MeasureName=MeasureDate
FontFace=#MainFont#
FontSize=#ClockDateSize#
FontColor=#ColorMain#,255
StringAlign=Right
X=0r
Y=-15R
AntiAlias=1