[Variables]
@Include=#@#Variables.inc

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Fastfetch
Author=Naeru
Information=Displays Fastfetch output directly on the desktop.
Version=1.0

[MeasureTimer]
Measure=Calc
Formula=(MeasureTimer % #FastfetchPollingRateSec#) + 1
IfCondition=MeasureTimer = 1
IfTrueAction=[!CommandMeasure MeasureFastfetch "Run"]

[MeasureFastfetch]
Measure=Plugin
Plugin=RunCommand
Parameter=fastfetch --config "#FastfetchConfigPath#" --logo none
OutputType=UTF8
State=Hide
Substitute="":"Loading..."

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,[MeterOutput:W],[MeterOutput:H],8 | Fill Color 36,39,58,0 | StrokeWidth 0
DynamicVariables=1

[MeterOutput]
Meter=String
MeasureName=MeasureFastfetch
FontFace=JetBrainsMonoNL Nerd Font
FontSize=11
FontColor=202,211,245,255
Padding=20,20,20,20
AntiAlias=1
Text=%1